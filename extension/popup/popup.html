<!DOCTYPE html>
<html>
<head>
    <title>Dark Pattern Analyzer</title>
    <style>
        body {
            width: 360px;
            padding: 16px;
            font-family: Arial, sans-serif;
        }

        h2 {
            margin-top: 0;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            cursor: pointer;
        }

        #status {
            margin-bottom: 12px;
        }

        .result {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
        }

        .label {
            font-weight: bold;
        }

        .section {
            margin-top: 12px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <h2>🛡 Dark Pattern Analyzer</h2>

    <button id="scanButton">
        Scan This Page
    </button>

    <div id="status"></div>

    <div id="result" class="result hidden">

        <div class="section">
            <span class="label">Pattern:</span>
            <span id="pattern"></span>
        </div>

        <div class="section">
            <span class="label">Severity:</span>
            <span id="severity"></span>
        </div>

        <div class="section">
            <span class="label">Confidence:</span>
            <span id="confidence"></span>
        </div>

        <div class="section">
            <span class="label">Evidence:</span>
            <div id="evidence"></div>
        </div>

        <div class="section">
            <span class="label">Why:</span>
            <div id="explanation"></div>
        </div>

        <div class="section" id="consumerSection">
            <span class="label">Consumer Protection:</span>
            <div id="consumerProtection"></div>
        </div>

    </div>

    <script src="popup.js"></script>

</body>
</html>
