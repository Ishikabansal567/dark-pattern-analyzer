
<!DOCTYPE html>
<html>
<head>
    <title>Dark Pattern Analyzer</title>

    <style>
        body {
            width: 360px;
            padding: 16px;
            font-family: Arial, sans-serif;
        }

        h2 {
            margin-top: 0;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            cursor: pointer;
        }

        #status {
            margin-bottom: 12px;
        }

        .result {
            max-height: 500px;
            overflow-y: auto;
        }

        .finding {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .finding-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .section {
            margin-top: 8px;
        }

        .label {
            font-weight: bold;
        }

        .evidence {
            margin-top: 4px;
            padding: 8px;
            background: #f5f5f5;
            border-radius: 5px;
        }

        .no-findings {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 12px;
        }
    </style>
</head>

<body>

    <h2> Dark Pattern Analyzer</h2>

    <button id="scanButton">
        Scan This Page
    </button>

    <div id="status"></div>

    <!-- Findings will be inserted here by popup.js -->
    <div id="result" class="result"></div>

    <script src="popup.js"></script>

</body>
</html>
